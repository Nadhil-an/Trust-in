name: Deploy to EC2

on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: nadhil-an/trust-in-backend
  IMAGE_NAME_GATEWAY: nadhil-an/trust-in-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirment.txt

      - name: Run Django Tests
        env:
          SECRET_KEY: 'test-secret-key-do-not-use-in-prod'
          FIELD_ENCRYPTION_KEY: 'YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE='
        run: |
          cd backend
          python manage.py test core hr_module --verbosity=2

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Build and push whatsapp-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/whatsapp_gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GATEWAY }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== 1. SYNC REPOSITORY ==="
            cd "$HOME/Trust-in" || cd Trust-in
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e backend/.env -e .env -e backend/media -e backend/whatsapp_gateway/auth_info_baileys

            echo "=== 2. LOGIN TO GHCR AND PULL LATEST IMAGE ==="
            sudo usermod -aG docker $USER 2>/dev/null || true
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            sudo docker compose pull backend

            echo "=== 3. RECREATE BACKEND CONTAINER WITH LATEST IMAGE ==="
            sudo docker compose up -d --force-recreate backend

            echo "=== 4. RUN MIGRATIONS AND COLLECTSTATIC ==="
            sleep 6
            sudo docker compose exec -T backend python manage.py migrate --noinput
            sudo docker compose exec -T backend python manage.py collectstatic --noinput

            echo "=== 5. VERIFY CONTAINER STATUS AND LOCAL ROUTES ==="
            sudo docker ps
            curl -I http://127.0.0.1:8000/api/core/social-polls/

            echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
