name: Deploy to EC2

on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: nadhil-an/trust-in-backend
  IMAGE_NAME_GATEWAY: nadhil-an/trust-in-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirment.txt

      - name: Run Django Tests
        env:
          SECRET_KEY: 'test-secret-key-do-not-use-in-prod'
          FIELD_ENCRYPTION_KEY: 'YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE='
        run: |
          cd backend
          python manage.py test core hr_module --verbosity=2

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Build and push whatsapp-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/whatsapp_gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GATEWAY }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== 1. DIAGNOSE RUNNING PROCESSES & CONTAINERS ==="
            pwd
            whoami
            docker ps -a || true
            ps aux | grep -E "daphne|gunicorn|python|manage.py" | grep -v grep || true
            ss -tlpn 2>/dev/null | grep 8000 || netstat -tlpn 2>/dev/null | grep 8000 || true

            echo "=== 2. LOCATE ALL PROJECT DIRECTORIES ==="
            find /home /opt -maxdepth 3 -name "docker-compose.yml" 2>/dev/null || true

            echo "=== 3. DEPLOY IN ~/Trust-in ==="
            if [ -d "$HOME/Trust-in" ]; then
              cd "$HOME/Trust-in"
              echo "In $HOME/Trust-in"
              git fetch origin main || true
              git reset --hard origin/main || true
              git clean -fd -e backend/.env -e .env -e backend/media -e backend/whatsapp_gateway/auth_info_baileys || true
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
              docker compose pull backend || true
              docker compose down backend || true
              docker compose up -d --force-recreate backend
              sleep 5
              docker compose exec -T backend python manage.py migrate --noinput || true
              docker compose exec -T backend python manage.py collectstatic --noinput || true
            fi

            echo "=== 4. DEPLOY IN /opt/sree-trust (IF EXISTS) ==="
            if [ -d "/opt/sree-trust" ]; then
              cd "/opt/sree-trust"
              echo "In /opt/sree-trust"
              if [ -d ".git" ]; then
                git fetch origin main || true
                git reset --hard origin/main || true
                git clean -fd -e backend/.env -e .env -e backend/media -e backend/whatsapp_gateway/auth_info_baileys || true
              fi
              docker compose pull backend || true
              docker compose down backend || true
              docker compose up -d --force-recreate backend
              sleep 5
              docker compose exec -T backend python manage.py migrate --noinput || true
            fi

            echo "=== 5. CHECK RUNNING CONTAINERS AND TEST LOCAL PORT 8000 ==="
            docker ps
            curl -I http://127.0.0.1:8000/api/core/events/ || true
            curl -I http://127.0.0.1:8000/api/core/social-polls/ || true
            docker compose logs --tail=30 backend || true

            echo "=== DEPLOYMENT SCRIPT FINISHED ==="
