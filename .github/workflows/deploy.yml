name: Deploy to EC2

on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: nadhil-an/trust-in-backend
  IMAGE_NAME_GATEWAY: nadhil-an/trust-in-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirment.txt

      - name: Run Django Tests
        env:
          SECRET_KEY: 'test-secret-key-do-not-use-in-prod'
          FIELD_ENCRYPTION_KEY: 'YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE='
        run: |
          cd backend
          python manage.py test core hr_module --verbosity=2

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Build and push whatsapp-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/whatsapp_gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GATEWAY }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Step 1: Navigating to project directory ==="
            if [ -d "$HOME/Trust-in" ]; then
              cd "$HOME/Trust-in"
            elif [ -d "Trust-in" ]; then
              cd Trust-in
            elif [ -d "/opt/sree-trust" ]; then
              cd /opt/sree-trust
            fi
            echo "Current directory: $(pwd)"

            echo "=== Step 2: Syncing git repository to main ==="
            git fetch origin main || true
            git reset --hard origin/main || true
            git clean -fd -e backend/.env -e .env -e backend/media -e backend/whatsapp_gateway/auth_info_baileys || true

            echo "=== Step 3: Logging into GitHub Container Registry ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true

            echo "=== Step 4: Pulling latest pre-built container image ==="
            docker compose pull backend || docker-compose pull backend || true

            echo "=== Step 5: Restarting backend with latest image ==="
            docker compose up -d --force-recreate backend || docker-compose up -d --force-recreate backend || docker compose up -d --build --force-recreate backend

            echo "=== Step 6: Waiting for backend container to stabilize ==="
            sleep 8

            echo "=== Step 7: Running migrations on EC2 ==="
            docker compose exec -T backend python manage.py migrate --noinput || docker-compose exec -T backend python manage.py migrate --noinput || true

            echo "=== Step 8: Collecting static files ==="
            docker compose exec -T backend python manage.py collectstatic --noinput || docker-compose exec -T backend python manage.py collectstatic --noinput || true

            echo "=== Step 9: Verifying container health & routes ==="
            docker compose ps || docker-compose ps || true
            
            echo "=== Deployment Finished Successfully ==="
