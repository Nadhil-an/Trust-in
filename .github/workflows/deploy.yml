name: Deploy to EC2

on:
  push:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: nadhil-an/trust-in-backend
  IMAGE_NAME_GATEWAY: nadhil-an/trust-in-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirment.txt

      - name: Run Django Tests
        env:
          SECRET_KEY: 'test-secret-key-do-not-use-in-prod'
          FIELD_ENCRYPTION_KEY: 'YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE='
        run: |
          cd backend
          python manage.py test core hr_module --verbosity=2

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Build and push whatsapp-gateway
        uses: docker/build-push-action@v5
        with:
          context: ./backend/whatsapp_gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GATEWAY }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "1. Connected to EC2 successfully!"
            
            # Determine active project directory
            if [ -d "$HOME/Trust-in" ]; then
              cd "$HOME/Trust-in"
            elif [ -d "/opt/sree-trust" ]; then
              cd /opt/sree-trust
            else
              cd Trust-in
            fi
            
            echo "2. Active directory: $(pwd)"
            
            echo "3. Fetching and resetting repository to origin/main..."
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            echo "4. Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            
            echo "5. Pulling latest pre-built container images..."
            docker compose pull backend whatsapp-gateway || true
            
            echo "6. Recreating containers with latest image..."
            docker compose up -d --force-recreate
            
            echo "7. Running database migrations on EC2..."
            docker compose exec -T backend python manage.py migrate --noinput
            
            echo "8. Collecting static files..."
            docker compose exec -T backend python manage.py collectstatic --noinput || true
            
            echo "9. Restarting host services if present..."
            if command -v systemctl &>/dev/null; then
              sudo systemctl restart daphne 2>/dev/null || true
              sudo systemctl restart gunicorn 2>/dev/null || true
              sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null || true
            fi
            
            echo "10. Container status:"
            docker compose ps
            
            echo "Deployment Complete!"
