services:
  # ── 1. Database (PostgreSQL) ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sreelakshmi_trust
      POSTGRES_USER: ${DB_USER:-trust_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trust_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trust_user} -d sreelakshmi_trust"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ⚠️ SECURITY: No 'ports' mapping — DB only accessible inside Docker network

  # ── 2. Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # ⚠️ SECURITY: No 'ports' mapping — Redis only accessible inside Docker network

  # ── 3. WhatsApp Gateway ───────────────────────────────────────────────
  whatsapp-gateway:
    build:
      context: ./backend/whatsapp_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # WhatsApp session — MUST persist across restarts (no QR re-scan)
      - ./backend/whatsapp_gateway/auth_info_baileys:/app/auth_info_baileys
      # Shared media folder — SAME bind mount as backend so receipt images are readable
      - ./backend/media:/app/media
    env_file:
      - ./backend/.env
    environment:
      # Path to media folder inside the container
      MEDIA_ROOT: /app/media
      # Internal Docker network URL — backend reaches gateway by container name
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001/send-message
    # Exposing 3001 to host for QR scan page: http://<EC2-IP>:3001/qr
    ports:
      - "3001:3001"

  # ── 4. Backend (Django/Daphne) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate --noinput &&
               python manage.py collectstatic --noinput &&
               daphne -b 0.0.0.0 -p 8000 sreelakshmi_trust.asgi:application"
    volumes:
      # Shared media folder — same bind mount as whatsapp-gateway
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override .env with Docker-internal service URLs
      DATABASE_URL: postgres://${DB_USER:-trust_user}:${DB_PASSWORD:-trust_pass_2026}@db:5432/sreelakshmi_trust
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
      # Gateway URL uses Docker internal network — NOT localhost
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001/send-message
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_started

  # ── 5. Frontend (React + Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL certificates from Let's Encrypt (certbot)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

# ── Persistent Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:   # PostgreSQL data — survives container restarts
