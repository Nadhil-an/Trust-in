services:
  # ── 1. Database (PostgreSQL) ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sreelakshmi_trust
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ⚠️ SECURITY: No 'ports' mapping here.
    # DB is only accessible inside the Docker private network.
    # Use 'docker-compose exec db psql' for admin access.

  # ── 2. Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ⚠️ SECURITY: No 'ports' mapping here.
    # Redis is only accessible inside the Docker private network.

  # ── 3. WhatsApp Gateway ───────────────────────────────────────────────
  whatsapp-gateway:
    build:
      context: ./backend/whatsapp_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend/whatsapp_gateway/auth_info_baileys:/app/auth_info_baileys
      - ./backend/media:/app/../media
    env_file:
      - ./backend/.env
    # ⚠️ SECURITY: No 'ports' mapping here.
    # Gateway only accessible from the backend service internally.

  # ── 4. Backend (Django/Daphne) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate &&
               daphne -b 0.0.0.0 -p 8000 sreelakshmi_trust.asgi:application"
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/sreelakshmi_trust
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - WHATSAPP_GATEWAY_URL=http://whatsapp-gateway:3001/send-message
    depends_on:
      - db
      - redis
      - whatsapp-gateway

  # ── 5. Frontend (React + Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# ── Persistent Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:   # PostgreSQL data — survives container restarts
  media_data:      # User uploaded files — survives container restarts
