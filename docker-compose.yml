services:
  # ── 1. Database (PostgreSQL) ─────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sreelakshmi_trust
      POSTGRES_USER: ${DB_USER:-trust_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trust_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trust_user} -d sreelakshmi_trust"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed — DB only accessible inside Docker network

  # ── 2. Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # No ports exposed — Redis only accessible inside Docker network

  # ── 3. WhatsApp Gateway ───────────────────────────────────────────────
  # Internal service — NOT exposed to internet directly
  # Backend reaches it via Docker network: http://whatsapp-gateway:3001
  whatsapp-gateway:
    build:
      context: ./backend/whatsapp_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # WhatsApp session files — MUST persist (no QR re-scan after restart)
      - ./backend/whatsapp_gateway/auth_info_baileys:/app/auth_info_baileys
      # Shared media — same bind mount as backend to read receipt images
      - ./backend/media:/app/media
    env_file:
      - ./backend/.env
    environment:
      MEDIA_ROOT: /app/media
    # Port 3001 only exposed for QR scan page on first setup
    # After WhatsApp is connected, you can remove this port mapping
    ports:
      - "3001:3001"

  # ── 4. Backend (Django/Daphne) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      bash -c "python manage.py migrate --noinput &&
               python manage.py collectstatic --noinput &&
               daphne -b 0.0.0.0 -p 8000 sreelakshmi_trust.asgi:application"
    volumes:
      # Shared media — same bind mount as whatsapp-gateway
      - ./backend/media:/app/media
      - ./backend/staticfiles:/app/staticfiles
    # No external port — only accessible through frontend nginx proxy
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      # These override any values in .env for Docker deployment
      DATABASE_URL: postgres://${DB_USER:-trust_user}:${DB_PASSWORD:-trust_pass_2026}@db:5432/sreelakshmi_trust
      REDIS_URL: redis://redis:6379/0
      USE_REDIS: "True"
      # Internal Docker network URL — never use localhost here
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3001/send-message
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-gateway:
        condition: service_started

  # ── 5. Frontend Nginx (serves React + proxies /api/ and /ws/) ─────────
  # This is the ONLY service exposed to the internet (port 80)
  # System Nginx on EC2 handles HTTPS (443) and proxies to this container (80)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

# ── Persistent Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:   # PostgreSQL data — survives container restarts
