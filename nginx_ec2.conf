# /etc/nginx/sites-available/api.sreelakshmicharity.org
# EC2 System-Level Nginx — handles HTTPS (SSL) and proxies to Docker Django Backend
# 
# SETUP:
#   1. sudo cp this file to /etc/nginx/sites-available/api.sreelakshmicharity.org
#   2. sudo ln -s /etc/nginx/sites-available/api.sreelakshmicharity.org /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d api.sreelakshmicharity.org
#   4. sudo nginx -t && sudo systemctl reload nginx

# ── HTTP & Reverse Proxy ──────────────────────────────────────────────
server {
    listen 80;
    server_name api.sreelakshmicharity.org;

    # Proxy ALL traffic to Django Backend container on port 8000
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 20M;
    }
}

