# /etc/nginx/sites-available/sreelakshmicharity.org
# EC2 System-Level Nginx — handles HTTPS (SSL) and proxies to Docker containers
# 
# SETUP:
#   1. sudo cp this file to /etc/nginx/sites-available/sreelakshmicharity.org
#   2. sudo ln -s /etc/nginx/sites-available/sreelakshmicharity.org /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d sreelakshmicharity.org -d www.sreelakshmicharity.org
#   4. sudo nginx -t && sudo systemctl reload nginx

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────
server {
    listen 80;
    server_name sreelakshmicharity.org www.sreelakshmicharity.org;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name sreelakshmicharity.org www.sreelakshmicharity.org;

    # SSL certificates — managed by Certbot (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/sreelakshmicharity.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sreelakshmicharity.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Forwarded-Proto "https" always;

    # Proxy ALL traffic to Docker frontend container on port 80
    # The Docker frontend nginx then routes /api/, /ws/, /media/ to the backend
    location / {
        proxy_pass         http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 20M;
    }
}
